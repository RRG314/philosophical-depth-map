name: Verify and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:analysis
      - run: python3 -m unittest discover -s lab/python -p 'test_*.py'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx wrangler deploy --dry-run --config server/wrangler.toml
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: psql -v ON_ERROR_STOP=1 -f database/001_initial.sql && psql -v ON_ERROR_STOP=1 -f database/test.sql && psql -v ON_ERROR_STOP=1 -f database/002_reasoning_lab.sql && psql -v ON_ERROR_STOP=1 -f database/test_lab.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
      - name: Verify private collector against disposable PostgreSQL
        run: |
          python3 -m venv /tmp/lab-test-env
          /tmp/lab-test-env/bin/pip install -r lab/python/requirements.txt
          psql -v ON_ERROR_STOP=1 -f database/optional_collector_role.sql
          /tmp/lab-test-env/bin/python lab/python/seed_database.py
          /tmp/lab-test-env/bin/python -m unittest discover -s lab/python -p 'test_collector_postgres.py'
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          LAB_DATABASE_URL: postgresql://localhost/postgres
          LAB_TEST_DATABASE_URL: postgresql://localhost/postgres
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.SITE_BASE_PATH || '/philosophical-depth-map/' }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: [verify, community]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  community:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run community:build
      - run: npx playwright install --with-deps chromium
      - name: Verify isolated community service and browser flows
        run: npx firebase emulators:exec --project demo-depth-map --only auth,firestore,functions "npm run test:community:service && npm run community:seed && npm run test:community:browser"
